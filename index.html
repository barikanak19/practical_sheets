<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practical PDF Library</title>
    <style>
      :root {
        --bg: #f7f8fa;
        --panel: #ffffff;
        --panel-alt: #f4f6fb;
        --border: #dfe4ec;
        --text: #1f2937;
        --muted: #5e6472;
        --primary: #1f5fcb;
        --primary-dark: #184ca9;
        --danger: #c43d3d;
        --success: #1e8e53;
        --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: var(--text);
      }

      body {
        min-height: 100vh;
      }

      button, input {
        font: inherit;
      }

      .app-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .site-footer {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      .topbar {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px 20px;
        box-shadow: var(--shadow);
        position: sticky;
        top: 12px;
        z-index: 10;
      }

      .brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2.2vw, 2.7rem);
        line-height: 1.2;
      }

      .inline-search input:focus,
      button:focus,
      .folder-main:focus-visible {
        outline: 3px solid rgba(31, 95, 203, 0.18);
        outline-offset: 2px;
      }

      button {
        cursor: pointer;
        border: 1px solid transparent;
        border-radius: 10px;
        transition: 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary-btn {
        background: var(--primary);
        color: white;
        min-height: 40px;
        padding: 0 16px;
      }

      .primary-btn:hover {
        background: var(--primary-dark);
      }

      .secondary-btn {
        background: #eef3ff;
        border-color: var(--border);
        color: var(--text);
        min-height: 40px;
        padding: 0 16px;
      }

      .ghost-btn {
        background: transparent;
        color: var(--muted);
        border-color: var(--border);
        min-height: 40px;
        padding: 0 12px;
      }

      .container {
        margin-top: 24px;
      }

      .view {
        display: none;
      }

      .view.active {
        display: block;
      }

      .page-head,
      .view-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        font-size: 0.72rem;
        color: var(--muted);
      }

      h2 {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2.1rem);
      }

      .stat-box {
        min-width: 140px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .stat-box strong {
        font-size: 1.35rem;
      }

      .stat-box span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .search-panel,
      .folder-card,
      .doc-row,
      .result-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
      }

      .search-panel {
        padding: 18px;
        margin-bottom: 24px;
      }

      .search-panel-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }

      .search-panel-header h3 {
        margin: 0;
        font-size: 1.05rem;
      }

      .muted {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .inline-search {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .inline-search input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        min-height: 46px;
        padding: 0 14px;
      }

      .status {
        min-height: 24px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .status.error {
        color: var(--danger);
      }

      .status.success {
        color: var(--success);
      }

      .folder-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
      }

      .folder-card {
        padding: 18px;
      }

      .folder-main {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        border: none;
        background: transparent;
        padding: 0;
        text-align: left;
      }

      .folder-icon {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 1.7rem;
        background: #eaf0ff;
        color: var(--primary);
      }

      .folder-main h3 {
        margin: 0 0 4px;
        font-size: 1.1rem;
      }

      .folder-main p {
        margin: 0;
        color: var(--muted);
      }

      .folder-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }

      .folder-actions > * {
        flex: 1;
      }

      .document-list,
      .result-list {
        display: grid;
        gap: 14px;
      }

      .doc-row,
      .result-card {
        padding: 14px 16px;
      }

      .doc-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .doc-title {
        margin: 0;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .doc-meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .doc-actions,
      .result-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .result-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
      }

      .result-summary {
        margin: 0 0 6px;
        font-weight: 700;
      }

      .match-snippet {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }

      .empty-state {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        color: var(--muted);
      }

      .viewer-shell {
        width: 100%;
        min-height: 70vh;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #f2f4f8;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 70vh;
        border: none;
        background: #fff;
      }

      .viewer-topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 768px) {
        .brand-row,
        .page-head,
        .view-header,
        .search-panel-header,
        .doc-row,
        .result-card {
          flex-direction: column;
          align-items: stretch;
        }

        .result-card {
          grid-template-columns: minmax(0, 1fr);
        }

        .inline-search,
        .folder-actions,
        .doc-actions,
        .result-actions {
          flex-direction: column;
        }

        .folder-actions > *,
        .doc-actions > *,
        .result-actions > * {
          width: 100%;
        }

        .app-shell {
          padding-left: 12px;
          padding-right: 12px;
        }

        .viewer-shell,
        iframe {
          min-height: 58vh;
          height: 58vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-row">
          <h1>Practical PDF Library</h1>
        </div>
      </header>

      <main class="container">
        <section id="homeView" class="view active" aria-live="polite">
          <div class="page-head">
            <div>
              <p class="eyebrow">Public library</p>
              <h2>Browse practical folders</h2>
            </div>
            <div class="stat-box">
              <strong id="totalDocCount">0</strong>
              <span>documents</span>
            </div>
          </div>

          <div id="homeSearchSlot">
            <div class="search-panel">
              <div class="search-panel-header">
                <h3>PDF text search</h3>
                <span class="muted">Selectable text only • may require OCR for scanned files</span>
              </div>
              <div class="inline-search">
                <input id="pdfTextSearch" type="search" placeholder="Search words inside PDF documents..." />
                <button id="clearPdfTextSearch" class="ghost-btn" type="button">Reset</button>
              </div>
              <div id="pdfSearchStatus" class="status"></div>
              <div id="pdfSearchResults" class="result-list"></div>
            </div>
          </div>
          <div id="folderGrid" class="folder-grid"></div>
        </section>

        <section id="practicalView" class="view" aria-live="polite">
          <div class="view-header">
            <button id="backToHome" class="secondary-btn" type="button">Back to Home</button>
            <h2 id="practicalTitle">Practical</h2>
          </div>
          <div id="practicalSearchSlot"></div>
          <div id="practicalList" class="document-list"></div>
        </section>

        <section id="viewerView" class="view">
          <div class="viewer-topbar">
            <button id="viewerBack" class="secondary-btn" type="button">Back</button>
            <button id="openInNewTab" class="secondary-btn" type="button">Open in New Tab</button>
            <button id="downloadCurrentPdf" class="primary-btn" type="button">Download PDF</button>
          </div>
          <div class="viewer-meta">
            <h2 id="viewerTitle">PDF Viewer</h2>
          </div>
          <div id="viewerError" class="status error" role="alert" style="display:none;"></div>
          <div class="viewer-shell">
            <iframe id="pdfFrame" title="PDF Viewer" allowfullscreen></iframe>
          </div>
        </section>
      </main>
      <footer class="site-footer">created by developer</footer>
    </div>

      const INDEX_VERSION = 1;

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeRegex(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function normalizeText(value) {
        return String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
      }

      function isAppRoute(route) {
        return Boolean(route && route.app === HISTORY_APP_KEY && ['home', 'practical', 'viewer'].includes(route.view));
      }

      function createRoute(view, values = {}) {
        return {
          app: HISTORY_APP_KEY,
          view,
          practicalId: values.practicalId || null,
          docUrl: values.docUrl || null,
          query: values.query || ''
        };
      }

      function currentRoute() {
        const route = window.history.state;
        if (isAppRoute(route)) {
          return { ...route };
        }
        return createRoute(state.currentView, {
          practicalId: state.currentPracticalId,
          docUrl: state.currentDoc && state.currentDoc.url,
          query: elements.pdfTextSearch.value
        });
      }

      function saveSearchQuery(query) {
        const route = currentRoute();
        route.query = query;
        if (isAppRoute(window.history.state)) {
          window.history.replaceState(route, '');
        }
      }

      function navigateToRoute(route, replace = false) {
        if (replace) {
          window.history.replaceState(route, '');
        } else {
          window.history.pushState(route, '');
        }
        renderRoute(route);
      }

      function navigateToPractical(practicalId) {
        const parent = currentRoute();
        const route = createRoute('practical', {
          practicalId,
          query: elements.pdfTextSearch.value
        });
        route.parent = parent;
        navigateToRoute(route);
      }

      function navigateToDocument(docUrl) {
        const parent = currentRoute();
        const doc = allDocs.find((item) => item.url === docUrl);
        if (!doc) {
          showStatus('The selected PDF could not be found.', 'error');
          return;
        }

        const route = createRoute('viewer', {
          practicalId: doc.practicalId,
          docUrl,
          query: elements.pdfTextSearch.value
        });
        route.parent = parent;
        navigateToRoute(route);
      }

      function goBackWithinApp(fallbackRoute) {
        const route = window.history.state;
        if (window.history.length > 1 && isAppRoute(route) && isAppRoute(route.parent)) {
          window.history.back();
          return;
        }

        navigateToRoute(fallbackRoute, true);
      }

      function restorePdfSearch(query, practicalId) {
        clearTimeout(state.textSearchTimer);
        state.pdfSearchToken += 1;
        elements.pdfTextSearch.value = query;
        elements.pdfSearchResults.innerHTML = '';
        showStatus('', '');

        if (query.trim().length >= 2) {
          performPdfTextSearch(query, practicalId);
        }
      }

      function showView(name) {
        state.currentView = name;
        if (name === 'home') {
          elements.homeSearchSlot.appendChild(elements.searchPanel);
        } else if (name === 'practical') {
          elements.practicalSearchSlot.appendChild(elements.searchPanel);
        }
        document.getElementById('homeView').classList.toggle('active', name === 'home');
        elements.practicalView.classList.toggle('active', name === 'practical');
        elements.viewerView.classList.toggle('active', name === 'viewer');
      }

      function renderRoute(route) {
        if (!isAppRoute(route)) {
          route = createRoute('home');
          window.history.replaceState(route, '');
        }

        if (route.view === 'home') {
          state.currentDoc = null;
          state.currentPracticalId = null;
          renderHome();
          showView('home');
          restorePdfSearch(route.query || '', null);
          return;
        }

        if (route.view === 'practical') {
          const practical = practicals.find((item) => item.id === route.practicalId);
          if (!practical) {
            const homeRoute = createRoute('home', { query: route.query });
            window.history.replaceState(homeRoute, '');
            renderRoute(homeRoute);
            return;
          }

          state.currentDoc = null;
          state.currentPracticalId = practical.id;
          renderPractical(practical.id);
          showView('practical');
          restorePdfSearch(route.query || '', practical.id);
          return;
        }

        const doc = allDocs.find((item) => item.url === route.docUrl);
        if (!doc) {
          const fallback = isAppRoute(route.parent)
            ? route.parent
            : createRoute('home', { query: route.query });
          window.history.replaceState(fallback, '');
          renderRoute(fallback);
          return;
        }

        openDocument(doc.url);
      }

      function renderHome() {
        elements.totalDocCount.textContent = String(allDocs.length);
        elements.folderGrid.innerHTML = practicals.map((practical) => `
          <article class="folder-card">
            <button class="folder-main" type="button" data-practical-id="${practical.id}" data-action="open-practical" aria-label="Open ${escapeHtml(practical.name)} practicals">
              <span class="folder-icon" aria-hidden="true">▣</span>
              <span class="folder-meta">
                <h3>${escapeHtml(practical.name)}</h3>
                <p>${practical.docs.length} PDFs</p>
              </span>
            </button>
            <div class="folder-actions">
              <button class="primary-btn" type="button" data-practical-id="${practical.id}" data-action="open-practical">View</button>
              <button class="secondary-btn" type="button" data-practical-id="${practical.id}" data-action="download-practical">Download All</button>
            </div>
          </article>
        `).join('');
      }

      function renderPractical(practicalId) {
        const practical = practicals.find((item) => item.id === practicalId);
        if (!practical) {
          elements.practicalList.innerHTML = '<div class="empty-state">This practical is unavailable.</div>';
          return;
        }

        state.currentPracticalId = practicalId;
        elements.practicalTitle.textContent = practical.name;
        if (!practical.docs.length) {
          elements.practicalList.innerHTML = '<div class="empty-state">No PDFs are available in this practical.</div>';
          return;
        }

        elements.practicalList.innerHTML = practical.docs.map((doc) => `
          <div class="doc-row">
            <div>
              <p class="doc-title">${escapeHtml(doc.filename)}</p>
              <div class="doc-meta">${escapeHtml(practical.name)}</div>
            </div>
            <div class="doc-actions">
              <button class="primary-btn" type="button" data-action="view-doc" data-doc-url="${escapeHtml(doc.url)}">View</button>
              <button class="secondary-btn" type="button" data-action="download-doc" data-doc-url="${escapeHtml(doc.url)}" data-doc-name="${escapeHtml(doc.filename)}">Download</button>
            </div>
          </div>
        `).join('');
      }

      function openDocument(docUrl) {
        const doc = allDocs.find((item) => item.url === docUrl);
        if (!doc) {
          showStatus('The selected PDF could not be found.', 'error');
          return;
        }

        state.currentDoc = doc;
        const practicalId = doc.practicalId;
        state.currentPracticalId = practicalId;

        elements.viewerTitle.textContent = doc.filename;
        elements.pdfFrame.src = doc.url;
        elements.pdfFrame.style.display = 'block';
        elements.viewerError.style.display = 'none';
        showView('viewer');
        const parent = window.history.state && window.history.state.parent;
        const parentPractical = isAppRoute(parent) && parent.view === 'practical'
          ? practicals.find((item) => item.id === parent.practicalId)
          : null;
        elements.viewerBack.textContent = parentPractical ? `Back to ${parentPractical.name}` : 'Back to Home';
      }

      function downloadFile(url, fileName) {
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = fileName;
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }

      function handleDocDownload(docUrl, fileName) {
        try {
          downloadFile(docUrl, fileName);
        } catch (error) {
          showStatus('Unable to download the PDF. Please try again.', 'error');
        }
      }

      function showStatus(message, type = '') {
        const target = elements.pdfSearchStatus;
        target.textContent = message;
        target.className = `status ${type}`.trim();
      }

      async function fetchBlob(url) {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }
        return response.blob();
      }

      async function createPracticalZip(practicalId) {
        if (!window.JSZip) {
          showStatus('ZIP download requires JSZip. The CDN library did not load.', 'error');
          return;
        }

        const practical = practicals.find((item) => item.id === practicalId);
        if (!practical) {
          showStatus('No practical found for zip creation.', 'error');
          return;
        }

        if (state.zipInProgress) {
          showStatus('A ZIP download is already being prepared. Please wait.', 'error');
          return;
        }

        state.zipInProgress = true;
        state.zipCurrentPracticalId = practicalId;
        showStatus(`Preparing ZIP for ${practical.name}...`, 'success');

        const zip = new JSZip();
        const progressLabel = document.createElement('div');
        progressLabel.className = 'status';
        progressLabel.textContent = `0 / ${practical.docs.length} files added`;
        elements.pdfSearchStatus.innerHTML = '';
        elements.pdfSearchStatus.appendChild(progressLabel);

        try {
          for (let index = 0; index < practical.docs.length; index += 1) {
            const doc = practical.docs[index];
            try {
              const blob = await fetchBlob(doc.url);
              zip.file(doc.filename, blob);
              progressLabel.textContent = `${index + 1} / ${practical.docs.length} files added`;
            } catch (error) {
              progressLabel.textContent = `${index + 1} / ${practical.docs.length} files added • some files were unavailable`;
            }
          }

          const content = await zip.generateAsync({ type: 'blob' }, (metadata) => {
            progressLabel.textContent = `Zipping ${metadata.percent.toFixed(0)}% • ${practical.docs.length} files`;
          });

          const fileName = `${practical.name.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, '')}.zip`;
          const objectUrl = URL.createObjectURL(content);
          const anchor = document.createElement('a');
          anchor.href = objectUrl;
          anchor.download = fileName;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);
          showStatus(`ZIP download for ${practical.name} is ready.`, 'success');
        } catch (error) {
          showStatus(`ZIP generation failed for ${practical.name}.`, 'error');
        } finally {
          state.zipInProgress = false;
          state.zipCurrentPracticalId = null;
        }
      }

      function openPdfDatabase() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            reject(new Error('IndexedDB is not available in this browser.'));
            return;
          }

          const request = window.indexedDB.open(INDEX_DB_NAME, INDEX_DB_VERSION);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains('documents')) {
              db.createObjectStore('documents', { keyPath: 'url' });
            }
            if (!db.objectStoreNames.contains('meta')) {
              db.createObjectStore('meta', { keyPath: 'key' });
            }

            if (db.objectStoreNames.contains('documents') && db.objectStoreNames.contains('meta')) {
              // Ensure the schema is fully present for older partial database states.
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error('Unable to open PDF index database.'));
        });
      }

      function readMetaRecord(db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('meta', 'readonly');
          const request = tx.objectStore('meta').get('settings');
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error || new Error('Failed to read PDF index metadata.'));
        });
      }

      function writeMetaRecord(db, payload) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('meta', 'readwrite');
          const request = tx.objectStore('meta').put({ key: 'settings', ...payload });
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error || new Error('Failed to save PDF index metadata.'));
        });
      }

      function readAllIndexedRecords(db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('documents', 'readonly');
          const request = tx.objectStore('documents').getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error || new Error('Failed to read the cached PDF records.'));
        });
      }

      function writeAllIndexedRecords(db, records) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('documents', 'readwrite');
          const store = tx.objectStore('documents');
          let completed = 0;
          records.forEach((record) => {
            const request = store.put(record);
            request.onsuccess = () => {
              completed += 1;
              if (completed === records.length) {
                resolve();
              }
            };
            request.onerror = () => reject(request.error || new Error('Failed to write a cached PDF record.'));
          });
          if (!records.length) {
            resolve();
          }
        });
      }

      function clearIndexStore(db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('documents', 'readwrite');
          const request = tx.objectStore('documents').clear();
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error || new Error('Unable to reset the PDF text index.'));
        });
      }

      function extractPageTextFromPdf(page) {
        return page.getTextContent().then((textContent) => {
          const items = Array.isArray(textContent && textContent.items) ? textContent.items : [];
          return items.map((item) => item && item.str ? item.str : '').join(' ').replace(/\s+/g, ' ').trim();
        });
      }

      async function extractPdfDocumentText(doc, token) {
        if (typeof window.pdfjsLib === 'undefined') {
          throw new Error('PDF.js is not available.');
        }

        const pdf = await window.pdfjsLib.getDocument(doc.url).promise;
        const pages = [];
        let combinedText = '';

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          if (token !== state.pdfIndexToken) {
            return null;
          }

          const page = await pdf.getPage(pageNumber);
          const pageText = await extractPageTextFromPdf(page);
          if (pageText) {
            const text = pageText.replace(/\s+/g, ' ').trim();
            pages.push({ pageNumber, text });
            combinedText += `${combinedText ? ' ' : ''}${text}`;
          }
        }

        return {
          url: doc.url,
          filename: doc.filename,
          practicalName: doc.practicalName,
          text: combinedText,
          pages,
          indexedAt: Date.now()
        };
      }

      async function ensurePdfIndexReady() {
        if (state.pdfIndexLoading) {
          return state.pdfIndexLoadingPromise;
        }

        state.pdfIndexLoading = true;
        state.pdfIndexReady = false;
        state.pdfIndexLoadingPromise = (async () => {
          const token = ++state.pdfIndexToken;
          let db;

          try {
            db = await openPdfDatabase();
            const meta = await readMetaRecord(db);
            const cached = await readAllIndexedRecords(db);

            if (meta && meta.version === INDEX_VERSION && meta.manifestSignature === MANIFEST_SIGNATURE && cached.length > 0) {
              state.pdfIndexRecords = new Map(cached.map((record) => [record.url, record]));
              state.pdfIndexReady = true;
              state.pdfIndexLoading = false;
              return cached;
            }

            if (meta && meta.version === INDEX_VERSION && meta.manifestSignature === MANIFEST_SIGNATURE && cached.length === 0) {
              showStatus('Cached index is empty. Rebuilding PDF text index...', '');
            }

            const records = [];
            const batchSize = 5;

            for (let start = 0; start < allDocs.length; start += batchSize) {
              if (token !== state.pdfIndexToken) {
                return [];
              }

              const batch = allDocs.slice(start, start + batchSize);
              const batchResults = await Promise.all(batch.map(async (doc) => {
                try {
                  return await extractPdfDocumentText(doc, token);
                } catch (error) {
                  console.warn(`Unable to extract text from ${doc.filename}:`, error);
                  return null;
                }
              }));

              batchResults.forEach((record) => {
                if (record && record.text) {
                  records.push(record);
                }
              });

              const completedCount = Math.min(start + batch.length, allDocs.length);
              showStatus(`Indexing ${completedCount}/${allDocs.length} PDFs...`, '');
            }

            if (token !== state.pdfIndexToken) {
              return [];
            }

            await clearIndexStore(db);
            await writeAllIndexedRecords(db, records);
            await writeMetaRecord(db, {
              version: INDEX_VERSION,
              manifestSignature: MANIFEST_SIGNATURE,
              indexedAt: Date.now(),
              total: records.length
            });

            state.pdfIndexRecords = new Map(records.map((record) => [record.url, record]));
            state.pdfIndexReady = true;
            showStatus(`Indexed ${records.length}/${allDocs.length} PDFs successfully.`, 'success');
            return records;
          } catch (error) {
            console.error('PDF index build failed:', error);
            showStatus('PDF indexing could not complete. Search will continue with available cached data.', 'error');
            state.pdfIndexReady = false;
            return [];
          } finally {
            state.pdfIndexLoading = false;
            delete state.pdfIndexLoadingPromise;
            if (db) {
              db.close();
            }
          }
        })();

        return state.pdfIndexLoadingPromise;
      }

      function buildSnippetText(text, query) {
        const cleaned = String(text || '').replace(/\s+/g, ' ').trim();
        if (!cleaned) {
          return 'No matching text was found on this page.';
        }

        const queryTerms = normalizeText(query).split(/\s+/).filter(Boolean);
        if (!queryTerms.length) {
          return cleaned.slice(0, 200);
        }

        const lower = cleaned.toLowerCase();
        let bestIndex = -1;
        for (const term of queryTerms) {
          const idx = lower.indexOf(term);
          if (idx !== -1 && (bestIndex === -1 || idx < bestIndex)) {
            bestIndex = idx;
          }
        }

        if (bestIndex === -1) {
          return cleaned.slice(0, 200);
        }

        const start = Math.max(0, bestIndex - 90);
        const end = Math.min(cleaned.length, start + 220);
        const snippet = cleaned.slice(start, end).trim();
        const safeSnippet = escapeHtml(snippet);
        let highlighted = safeSnippet;
        queryTerms.forEach((term) => {
          const regex = new RegExp(escapeRegex(term), 'gi');
          highlighted = highlighted.replace(regex, (match) => `<mark>${match}</mark>`);
        });
        return highlighted;
      }

      function searchCachedPdfIndex(query, practicalId = null) {
        const normalizedQuery = normalizeText(query);
        const terms = normalizedQuery.split(/\s+/).filter(Boolean);
        if (!normalizedQuery || terms.length === 0) {
          return [];
        }

        const practical = practicals.find((item) => item.id === practicalId);
        const practicalUrls = practical ? new Set(practical.docs.map((doc) => doc.url)) : null;
        const matches = [];

        for (const record of state.pdfIndexRecords.values()) {
          if (!record || !Array.isArray(record.pages)) {
            continue;
          }
          if (practicalUrls && !practicalUrls.has(record.url)) {
            continue;
          }

          let bestMatch = null;
          for (const page of record.pages) {
            const pageText = normalizeText(page.text || '');
            if (!pageText) {
              continue;
            }

            const phraseMatch = normalizedQuery.includes(' ') ? pageText.includes(normalizedQuery) : false;
            const allTermsMatch = terms.every((term) => pageText.includes(term));
            const anyTermMatch = terms.some((term) => pageText.includes(term));

            if (!phraseMatch && !allTermsMatch && !anyTermMatch) {
              continue;
            }

            const score = (phraseMatch ? 4 : 0) + (allTermsMatch ? 3 : 0) + (terms.length === 1 ? pageText.split(terms[0]).length - 1 : 0);
            const snippet = buildSnippetText(page.text, normalizedQuery);

            if (!bestMatch || score > bestMatch.score) {
              bestMatch = {
                score,
                pageNumber: page.pageNumber,
                snippet
              };
            }
          }

          if (bestMatch) {
            matches.push({
              filename: record.filename,
              practicalName: record.practicalName,
              url: record.url,
              pageNumber: bestMatch.pageNumber,
              snippet: bestMatch.snippet,
              score: bestMatch.score
            });
          }
        }

        matches.sort((a, b) => b.score - a.score);
        return matches;
      }

      function renderPdfTextSearchResults(matches) {
        if (!matches.length) {
          elements.pdfSearchResults.innerHTML = '<div class="empty-state">No PDF text matches were found. This may mean the text is not selectable or the file is image-only.</div>';
          return;
        }

        elements.pdfSearchResults.innerHTML = matches.map((match) => `
          <article class="result-card">
            <div>
              <p class="result-summary">${escapeHtml(match.filename)}</p>
              <p class="match-snippet">${escapeHtml(match.practicalName)} • Page ${match.pageNumber} • ${match.snippet}</p>
            </div>
            <div class="result-actions">
              <button class="primary-btn" type="button" data-action="view-doc" data-doc-url="${escapeHtml(match.url)}">View</button>
              <button class="secondary-btn" type="button" data-action="download-doc" data-doc-url="${escapeHtml(match.url)}" data-doc-name="${escapeHtml(match.filename)}">Download</button>
            </div>
          </article>
        `).join('');
      }

      async function performPdfTextSearch(query, practicalId = null) {
        const searchQuery = query.trim();
        if (!searchQuery || searchQuery.length < 2) {
          elements.pdfSearchResults.innerHTML = '';
          showStatus('Enter at least 2 characters to search within PDFs.', '');
          return;
        }

        const currentToken = ++state.pdfSearchToken;
        try {
          showStatus('Preparing cached PDF text search...', '');
          await ensurePdfIndexReady();
          if (currentToken !== state.pdfSearchToken) {
            return;
          }

          if (!state.pdfIndexReady || state.pdfIndexRecords.size === 0) {
            elements.pdfSearchResults.innerHTML = '<div class="empty-state">The PDF text index is not ready yet. Please try again shortly.</div>';
            showStatus('The PDF text index is still being prepared.', '');
            return;
          }

          const matches = searchCachedPdfIndex(searchQuery, practicalId);
          if (currentToken !== state.pdfSearchToken) {
            return;
          }

          if (!matches.length) {
            elements.pdfSearchResults.innerHTML = '<div class="empty-state">No PDF text matches were found. This may mean the text is not selectable or the file is image-only.</div>';
            showStatus('No PDF text matches found. Scanned or image-only PDFs may need OCR before they can be searched.', '');
            return;
          }

          renderPdfTextSearchResults(matches);
          showStatus(`Found ${matches.length} matching PDF document${matches.length === 1 ? '' : 's'}.`, 'success');
        } catch (error) {
          console.error('PDF search error:', error);
          elements.pdfSearchResults.innerHTML = '<div class="empty-state">Unable to search the cached PDF text index. Please try again.</div>';
          showStatus('PDF text search failed. Please try again.', 'error');
        }
      }

      function attachEventHandlers() {
        document.addEventListener('click', (event) => {
          const button = event.target.closest('[data-action]');
          if (!button) {
            return;
          }

          const action = button.dataset.action;

          if (action === 'open-practical') {
            const practicalId = button.dataset.practicalId;
            navigateToPractical(practicalId);
            return;
          }

          if (action === 'download-practical') {
            const practicalId = button.dataset.practicalId;
            createPracticalZip(practicalId);
            return;
          }

          if (action === 'view-doc') {
            const docUrl = button.dataset.docUrl;
            navigateToDocument(docUrl);
            return;
          }

          if (action === 'download-doc') {
            const docUrl = button.dataset.docUrl;
            const docName = button.dataset.docName || decodeURIComponent(docUrl.split('/').pop());
            handleDocDownload(docUrl, docName);
          }
        });

        elements.clearPdfTextSearch.addEventListener('click', () => {
          elements.pdfTextSearch.value = '';
          elements.pdfSearchResults.innerHTML = '';
          showStatus('', '');
          state.pdfSearchToken += 1;
          clearTimeout(state.textSearchTimer);
          saveSearchQuery('');
        });

        elements.pdfTextSearch.addEventListener('input', (event) => {
          const query = event.target.value;
          const trimmed = query.trim();

          clearTimeout(state.textSearchTimer);
          state.pdfSearchToken += 1;
          saveSearchQuery(query);

          if (!trimmed) {
            elements.pdfSearchResults.innerHTML = '';
            showStatus('', '');
            return;
          }

          const practicalId = state.currentView === 'practical' ? state.currentPracticalId : null;
          state.textSearchTimer = setTimeout(() => {
            performPdfTextSearch(trimmed, practicalId);
          }, 250);
        });

        elements.backToHome.addEventListener('click', () => {
          goBackWithinApp(createRoute('home', { query: elements.pdfTextSearch.value }));
        });

        elements.viewerBack.addEventListener('click', () => {
          const route = window.history.state;
          const fallback = isAppRoute(route && route.parent)
            ? route.parent
            : createRoute('home', { query: elements.pdfTextSearch.value });
          goBackWithinApp(fallback);
        });

        window.addEventListener('popstate', (event) => {
          if (isAppRoute(event.state)) {
            renderRoute(event.state);
          } else {
            const homeRoute = createRoute('home');
            window.history.replaceState(homeRoute, '');
            renderRoute(homeRoute);
          }
        });

        elements.openInNewTab.addEventListener('click', () => {
          if (state.currentDoc) {
            window.open(state.currentDoc.url, '_blank', 'noopener,noreferrer');
          }
        });

        elements.downloadCurrentPdf.addEventListener('click', () => {
          if (state.currentDoc) {
            handleDocDownload(state.currentDoc.url, state.currentDoc.filename);
          }
        });

        elements.pdfFrame.addEventListener('error', () => {
          elements.viewerError.textContent = 'This PDF could not be displayed inline. Open it in a new tab or download it instead.';
          elements.viewerError.style.display = 'block';
          elements.pdfFrame.style.display = 'none';
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        attachEventHandlers();
        const initialRoute = isAppRoute(window.history.state)
          ? window.history.state
          : createRoute('home');
        window.history.replaceState(initialRoute, '');
        renderRoute(initialRoute);
        showStatus('Loading the PDF text index...', '');
        ensurePdfIndexReady().catch(() => {
          showStatus('The PDF text index could not be loaded. Fallback search remains available.', 'error');
        });
      });
    </script>
  </body>
</html>
