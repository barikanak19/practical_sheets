<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practical PDF Library</title>
    <style>
      :root {
        --bg: #f7f8fa;
        --panel: #ffffff;
        --panel-alt: #f4f6fb;
        --border: #dfe4ec;
        --text: #1f2937;
        --muted: #5e6472;
        --primary: #1f5fcb;
        --primary-dark: #184ca9;
        --danger: #c43d3d;
        --success: #1e8e53;
        --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: var(--text);
      }

      body {
        min-height: 100vh;
      }

      button, input {
        font: inherit;
      }

      .app-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .site-footer {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      .topbar {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px 20px;
        box-shadow: var(--shadow);
        position: sticky;
        top: 12px;
        z-index: 10;
      }

      .brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2.2vw, 2.7rem);
        line-height: 1.2;
      }

      .inline-search input:focus,
      button:focus,
      .doc-title-button:focus-visible {
        outline: 3px solid rgba(31, 95, 203, 0.18);
        outline-offset: 2px;
      }

      button {
        cursor: pointer;
        border: 1px solid transparent;
        border-radius: 10px;
        transition: 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary-btn {
        background: var(--primary);
        color: white;
        min-height: 40px;
        padding: 0 16px;
      }

      .primary-btn:hover {
        background: var(--primary-dark);
      }

      .secondary-btn {
        background: #eef3ff;
        border-color: var(--border);
        color: var(--text);
        min-height: 40px;
        padding: 0 16px;
      }

      .ghost-btn {
        background: transparent;
        color: var(--muted);
        border-color: var(--border);
        min-height: 40px;
        padding: 0 12px;
      }

      .container {
        margin-top: 24px;
      }

      .view {
        display: none;
      }

      .view.active {
        display: block;
      }

      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        font-size: 0.72rem;
        color: var(--muted);
      }

      h2 {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2.1rem);
      }

      .stat-box {
        min-width: 140px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .stat-box strong {
        font-size: 1.35rem;
      }

      .stat-box span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .search-panel,
      .pdf-card,
      .result-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
      }

      .search-panel {
        padding: 18px;
        margin-bottom: 24px;
      }

      .search-panel-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }

      .search-panel-header h3 {
        margin: 0;
        font-size: 1.05rem;
      }

      .muted {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .inline-search {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .inline-search input {
        flex: 1 1 auto;
        min-width: 0;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        min-height: 46px;
        padding: 0 14px;
      }

      .inline-search button {
        flex: 0 0 auto;
      }

      .status {
        min-height: 24px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .status.error {
        color: var(--danger);
      }

      .status.success {
        color: var(--success);
      }

      .pdf-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }

      .pdf-card {
        padding: 18px;
      }

      .pdf-card h3 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        overflow-wrap: anywhere;
      }

      .doc-title-button {
        border: 0;
        background: transparent;
        color: var(--primary);
        padding: 0;
        text-align: left;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .doc-title-button:hover {
        color: var(--primary-dark);
        text-decoration: underline;
      }

      .pdf-card .doc-meta {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .pdf-card-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }

      .pdf-card-actions > * {
        flex: 1;
      }

      .result-list {
        display: grid;
        gap: 14px;
      }

      .result-card {
        padding: 14px 16px;
      }

      .doc-meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .result-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .result-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
      }

      .result-summary {
        margin: 0 0 6px;
        font-weight: 700;
      }

      .match-snippet {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }

      .empty-state {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        color: var(--muted);
      }

      .viewer-shell {
        width: 100%;
        min-height: 70vh;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #f2f4f8;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 70vh;
        border: none;
        background: #fff;
      }

      .viewer-topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 768px) {
        .brand-row,
        .page-head,
        .search-panel-header,
        .result-card {
          flex-direction: column;
          align-items: stretch;
        }

        .result-card {
          grid-template-columns: minmax(0, 1fr);
        }

        .inline-search,
        .pdf-card-actions,
        .result-actions {
          flex-direction: column;
        }

        .pdf-card-actions > *,
        .inline-search button,
        .result-actions > * {
          width: 100%;
        }

        .app-shell {
          padding-left: 12px;
          padding-right: 12px;
        }

        .viewer-shell,
        iframe {
          min-height: 58vh;
          height: 58vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-row">
          <h1>Practical PDF Library</h1>
        </div>
      </header>

      <main class="container">
        <section id="homeView" class="view active" aria-live="polite">
          <div class="page-head">
            <div>
              <p class="eyebrow">Public library</p>
              <h2>Browse PDFs</h2>
            </div>
            <div class="stat-box">
              <strong id="totalDocCount">0</strong>
              <span>PDFs</span>
            </div>
          </div>

          <div id="homeSearchSlot">
            <div class="search-panel">
              <div class="search-panel-header">
                <h3>PDF text search</h3>
                <span class="muted">Search words and phrases in PDF contents</span>
              </div>
              <form id="pdfSearchForm" class="inline-search" role="search">
                <input id="pdfTextSearch" type="search" placeholder="Search words inside PDF documents..." aria-label="Search PDF contents" />
                <button class="primary-btn" type="submit">Search</button>
                <button id="clearPdfTextSearch" class="ghost-btn" type="button">Reset</button>
              </form>
              <div id="pdfSearchStatus" class="status"></div>
              <div id="pdfSearchResults" class="result-list"></div>
            </div>
          </div>
          <div id="pdfGrid" class="pdf-grid"></div>
        </section>

        <section id="viewerView" class="view">
          <div class="viewer-topbar">
            <button id="viewerBack" class="secondary-btn" type="button">Back</button>
            <button id="openInNewTab" class="secondary-btn" type="button">Open in New Tab</button>
            <button id="downloadCurrentPdf" class="primary-btn" type="button">Download PDF</button>
          </div>
          <div class="viewer-meta">
            <h2 id="viewerTitle">PDF Viewer</h2>
          </div>
          <div id="viewerError" class="status error" role="alert" style="display:none;"></div>
          <div class="viewer-shell">
            <iframe id="pdfFrame" title="PDF Viewer" allowfullscreen></iframe>
          </div>
        </section>
      </main>
      <footer class="site-footer">created by developer</footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
    <script>
      const allDocs = [
        { filename: 'AI_ML.pdf', url: 'AI_ML.pdf' },
        { filename: 'Android.pdf', url: 'Android.pdf' },
        { filename: 'Applied_Business.pdf', url: 'Applied_Business.pdf' },
        { filename: 'Data Visuliazation.pdf', url: 'Data%20Visuliazation.pdf' },
        { filename: 'Dot Net.pdf', url: 'Dot%20Net.pdf' },
        { filename: 'Full-Stack.pdf', url: 'Full-Stack.pdf' },
        { filename: 'IOT.pdf', url: 'IOT.pdf' }
      ];
      const INDEX_DB_NAME = 'practical-pdf-library-index';
      const INDEX_DB_VERSION = 3;
      const INDEX_VERSION = 2;
      const MANIFEST_SIGNATURE = allDocs.map((doc) => `${doc.url}|${doc.filename}`).join('|');
      const HISTORY_APP_KEY = 'practical-pdf-library';

      const state = {
        currentView: 'home',
        currentDoc: null,
        pdfSearchToken: 0,
        pdfIndexRecords: new Map(),
        pdfIndexReady: false,
        pdfIndexValidated: false,
        pdfIndexLoadingPromise: null,
        pdfIndexRefreshPromise: null,
        textSearchTimer: null
      };

      const elements = {
        pdfGrid: document.getElementById('pdfGrid'),
        totalDocCount: document.getElementById('totalDocCount'),
        pdfSearchForm: document.getElementById('pdfSearchForm'),
        pdfTextSearch: document.getElementById('pdfTextSearch'),
        clearPdfTextSearch: document.getElementById('clearPdfTextSearch'),
        pdfSearchStatus: document.getElementById('pdfSearchStatus'),
        pdfSearchResults: document.getElementById('pdfSearchResults'),
        homeView: document.getElementById('homeView'),
        viewerView: document.getElementById('viewerView'),
        viewerTitle: document.getElementById('viewerTitle'),
        pdfFrame: document.getElementById('pdfFrame'),
        viewerError: document.getElementById('viewerError'),
        openInNewTab: document.getElementById('openInNewTab'),
        downloadCurrentPdf: document.getElementById('downloadCurrentPdf'),
        viewerBack: document.getElementById('viewerBack')
      };

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeRegex(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function normalizeText(value) {
        return String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
      }

      function showStatus(message, type = '') {
        elements.pdfSearchStatus.textContent = message;
        elements.pdfSearchStatus.className = `status ${type}`.trim();
      }

      function isAppRoute(route) {
        return Boolean(route && route.app === HISTORY_APP_KEY && ['home', 'viewer'].includes(route.view));
      }

      function createRoute(view, values = {}) {
        return {
          app: HISTORY_APP_KEY,
          view,
          docUrl: values.docUrl || null,
          pageNumber: values.pageNumber || 1,
          query: values.query || ''
        };
      }

      function currentRoute() {
        const route = window.history.state;
        if (isAppRoute(route)) return { ...route };
        return createRoute(state.currentView, {
          docUrl: state.currentDoc && state.currentDoc.url,
          query: elements.pdfTextSearch.value
        });
      }

      function saveSearchQuery(query) {
        const route = currentRoute();
        route.query = query;
        if (isAppRoute(window.history.state)) window.history.replaceState(route, '');
      }

      function navigateToRoute(route, replace = false) {
        if (replace) window.history.replaceState(route, '');
        else window.history.pushState(route, '');
        renderRoute(route);
      }

      function navigateToDocument(docUrl, pageNumber = 1) {
        if (!allDocs.some((doc) => doc.url === docUrl)) {
          showStatus('The selected PDF could not be found.', 'error');
          return;
        }
        const route = createRoute('viewer', { docUrl, pageNumber, query: elements.pdfTextSearch.value });
        route.parent = currentRoute();
        navigateToRoute(route);
      }

      function goBackWithinApp(fallbackRoute) {
        const route = window.history.state;
        if (window.history.length > 1 && isAppRoute(route) && isAppRoute(route.parent)) {
          window.history.back();
          return;
        }
        navigateToRoute(fallbackRoute, true);
      }

      function restorePdfSearch(query) {
        clearTimeout(state.textSearchTimer);
        state.pdfSearchToken += 1;
        elements.pdfTextSearch.value = query;
        elements.pdfSearchResults.innerHTML = '';
        showStatus('', '');
        if (query.trim().length >= 1) performPdfTextSearch(query);
      }

      function showView(name) {
        state.currentView = name;
        elements.homeView.classList.toggle('active', name === 'home');
        elements.viewerView.classList.toggle('active', name === 'viewer');
      }

      function renderRoute(route) {
        if (!isAppRoute(route)) {
          route = createRoute('home');
          window.history.replaceState(route, '');
        }
        if (route.view === 'home') {
          state.currentDoc = null;
          renderHome();
          showView('home');
          restorePdfSearch(route.query || '');
          return;
        }
        const doc = allDocs.find((item) => item.url === route.docUrl);
        if (!doc) {
          const fallback = isAppRoute(route.parent) ? route.parent : createRoute('home', { query: route.query });
          window.history.replaceState(fallback, '');
          renderRoute(fallback);
          return;
        }
        openDocument(doc.url, route.pageNumber);
      }

      function renderHome() {
        elements.totalDocCount.textContent = String(allDocs.length);
        elements.pdfGrid.innerHTML = allDocs.map((doc) => `
          <article class="pdf-card">
            <h3><button class="doc-title-button" type="button" data-action="view-doc" data-doc-url="${escapeHtml(doc.url)}">${escapeHtml(doc.filename)}</button></h3>
            <p class="doc-meta">PDF document</p>
            <div class="pdf-card-actions">
              <button class="primary-btn" type="button" data-action="view-doc" data-doc-url="${escapeHtml(doc.url)}">View PDF</button>
              <button class="secondary-btn" type="button" data-action="download-doc" data-doc-url="${escapeHtml(doc.url)}" data-doc-name="${escapeHtml(doc.filename)}">Download</button>
            </div>
          </article>
        `).join('');
      }

      function openDocument(docUrl, pageNumber = 1) {
        const doc = allDocs.find((item) => item.url === docUrl);
        if (!doc) {
          showStatus('The selected PDF could not be found.', 'error');
          return;
        }
        state.currentDoc = doc;
        elements.viewerTitle.textContent = doc.filename;
        elements.pdfFrame.src = pageNumber > 1 ? `${doc.url}#page=${pageNumber}` : doc.url;
        elements.pdfFrame.style.display = 'block';
        elements.viewerError.style.display = 'none';
        showView('viewer');
      }

      function downloadFile(url, fileName) {
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = fileName;
        anchor.rel = 'noopener noreferrer';
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }

      function handleDocDownload(docUrl, fileName) {
        try {
          downloadFile(docUrl, fileName);
        } catch (error) {
          console.error('PDF download failed:', error);
          showStatus('Unable to download the PDF. Please try again.', 'error');
        }
      }

      function openPdfDatabase() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            reject(new Error('IndexedDB is not available in this browser.'));
            return;
          }
          const request = window.indexedDB.open(INDEX_DB_NAME, INDEX_DB_VERSION);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains('documents')) db.createObjectStore('documents', { keyPath: 'url' });
            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error('Unable to open the PDF index database.'));
        });
      }

      function readIndexData(db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(['documents', 'meta'], 'readonly');
          const recordsRequest = tx.objectStore('documents').getAll();
          const metaRequest = tx.objectStore('meta').get('settings');
          let records;
          let meta;
          recordsRequest.onsuccess = () => { records = recordsRequest.result || []; };
          metaRequest.onsuccess = () => { meta = metaRequest.result || null; };
          tx.oncomplete = () => resolve({ records, meta });
          tx.onerror = () => reject(tx.error || new Error('Failed to read the cached PDF text index.'));
          tx.onabort = () => reject(tx.error || new Error('Reading the PDF text index was aborted.'));
        });
      }

      function writeIndexRecord(db, record) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('documents', 'readwrite');
          tx.objectStore('documents').put(record);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error || new Error('Failed to save a PDF text record.'));
          tx.onabort = () => reject(tx.error || new Error('Saving a PDF text record was aborted.'));
        });
      }

      function writeIndexMeta(db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('meta', 'readwrite');
          tx.objectStore('meta').put({ key: 'settings', version: INDEX_VERSION, manifestSignature: MANIFEST_SIGNATURE, updatedAt: Date.now() });
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error || new Error('Failed to save PDF index metadata.'));
          tx.onabort = () => reject(tx.error || new Error('Saving PDF index metadata was aborted.'));
        });
      }

      function clearIndexRecords(db) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction('documents', 'readwrite');
          tx.objectStore('documents').clear();
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error || new Error('Unable to reset the PDF text index.'));
          tx.onabort = () => reject(tx.error || new Error('Resetting the PDF text index was aborted.'));
        });
      }

      async function getPdfRevision(doc) {
        const response = await fetch(doc.url, { method: 'HEAD', cache: 'no-cache' });
        if (!response.ok) throw new Error(`Could not check ${doc.filename} for updates (HTTP ${response.status}).`);
        return {
          available: true,
          value: response.headers.get('etag')
            || response.headers.get('last-modified')
            || response.headers.get('content-length')
            || null
        };
      }

      async function extractPdfDocumentText(doc, revision) {
        if (!window.pdfjsLib) throw new Error('PDF.js did not load.');
        const pdf = await window.pdfjsLib.getDocument(doc.url).promise;
        const pages = [];
        try {
          for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
            const page = await pdf.getPage(pageNumber);
            const content = await page.getTextContent();
            const text = content.items.map((item) => item && typeof item.str === 'string' ? item.str : '').join(' ').replace(/\s+/g, ' ').trim();
            if (text) pages.push({ pageNumber, text });
            page.cleanup();
          }
        } finally {
          await pdf.destroy();
        }
        return { url: doc.url, filename: doc.filename, revision, pages, status: pages.length ? 'indexed' : 'empty', indexedAt: Date.now() };
      }

      async function refreshPdfIndex(db, cachedRecords, showProgress) {
        const revisions = await Promise.all(allDocs.map(async (doc) => {
          try {
            return await getPdfRevision(doc);
          } catch (error) {
            console.warn(`Unable to check PDF revision for ${doc.filename}:`, error);
            return { available: false, value: null };
          }
        }));
        const docsToIndex = allDocs.filter((doc, index) => {
          const cached = cachedRecords.get(doc.url);
          return !cached
            || cached.status === 'error'
            || (revisions[index].available && cached.revision !== revisions[index].value);
        });
        let completed = 0;
        let nextIndex = 0;
        const processNext = async () => {
          while (nextIndex < docsToIndex.length) {
            const doc = docsToIndex[nextIndex++];
            const docIndex = allDocs.indexOf(doc);
            let record;
            const revision = revisions[docIndex].available
              ? revisions[docIndex].value
              : cachedRecords.get(doc.url)?.revision ?? null;
            try {
              record = await extractPdfDocumentText(doc, revision);
            } catch (error) {
              console.warn(`Unable to index ${doc.filename}:`, error);
              record = { url: doc.url, filename: doc.filename, revision, pages: [], status: 'error', error: error.message, indexedAt: Date.now() };
            }
            await writeIndexRecord(db, record);
            state.pdfIndexRecords.set(doc.url, record);
            completed += 1;
            if (showProgress) showStatus(`Indexing PDFs: ${completed}/${docsToIndex.length} updated.`, '');
          }
        };
        await Promise.all([processNext(), processNext()]);
        await writeIndexMeta(db);
        state.pdfIndexReady = true;
        if (showProgress) {
          const records = [...state.pdfIndexRecords.values()];
          const noText = records.filter((record) => record.status === 'empty');
          const failed = records.filter((record) => record.status === 'error');
          const searchable = records.filter((record) => record.status === 'indexed').length;
          const details = [];
          if (noText.length) details.push(`OCR may be required for: ${noText.map((record) => record.filename).join(', ')}.`);
          if (failed.length) details.push(`Text extraction failed for: ${failed.map((record) => record.filename).join(', ')}.`);
          showStatus(
            `Index ready: ${searchable}/${allDocs.length} PDFs have searchable text.${details.length ? ` ${details.join(' ')}` : ''}`,
            failed.length ? 'error' : searchable ? 'success' : 'error'
          );
        }
        state.pdfIndexValidated = true;
        return docsToIndex.length;
      }

      async function ensurePdfIndexReady() {
        if (state.pdfIndexReady && state.pdfIndexValidated) return state.pdfIndexRecords;
        if (state.pdfIndexLoadingPromise) return state.pdfIndexLoadingPromise;
        if (state.pdfIndexRefreshPromise) return state.pdfIndexRecords;
        state.pdfIndexLoadingPromise = (async () => {
          let db;
          try {
            db = await openPdfDatabase();
            const { records, meta } = await readIndexData(db);
            const manifestMatches = meta && meta.version === INDEX_VERSION && meta.manifestSignature === MANIFEST_SIGNATURE;
            if (!manifestMatches) await clearIndexRecords(db);
            const validUrls = new Set(allDocs.map((doc) => doc.url));
            const cachedRecords = manifestMatches ? records.filter((record) => validUrls.has(record.url)) : [];
            state.pdfIndexRecords = new Map(cachedRecords.map((record) => [record.url, record]));
            const hasCompleteCache = allDocs.every((doc) => state.pdfIndexRecords.has(doc.url));
            state.pdfIndexReady = hasCompleteCache;
            const refreshPromise = refreshPdfIndex(db, state.pdfIndexRecords, !hasCompleteCache);
            if (hasCompleteCache) {
              state.pdfIndexRefreshPromise = refreshPromise
                .then((updatedCount) => {
                  const query = elements.pdfTextSearch.value.trim();
                  if (updatedCount && query.length >= 1) performPdfTextSearch(query, true);
                })
                .catch((error) => {
                  console.error('PDF index update failed:', error);
                  showStatus('Could not check for updated PDFs. The saved index is still available.', 'error');
                })
                .finally(() => {
                  db.close();
                  state.pdfIndexRefreshPromise = null;
                });
              return state.pdfIndexRecords;
            }
            await refreshPromise;
            return state.pdfIndexRecords;
          } catch (error) {
            console.error('PDF index preparation failed:', error);
            state.pdfIndexReady = state.pdfIndexRecords.size > 0;
            showStatus('The PDF text index could not be prepared. Check your connection and try again.', 'error');
            throw error;
          } finally {
            if (!state.pdfIndexRefreshPromise && db) db.close();
            state.pdfIndexLoadingPromise = null;
          }
        })();
        return state.pdfIndexLoadingPromise;
      }

      function buildSnippetText(text, query) {
        const cleaned = String(text || '').replace(/\s+/g, ' ').trim();
        if (!cleaned) return 'No matching text was found on this page.';
        const terms = [...new Set(normalizeText(query).split(/\s+/).filter(Boolean))];
        const lower = cleaned.toLowerCase();
        let matchIndex = lower.indexOf(normalizeText(query));
        if (matchIndex < 0) {
          matchIndex = terms.reduce((best, term) => {
            const index = lower.indexOf(term);
            return index >= 0 && (best < 0 || index < best) ? index : best;
          }, -1);
        }
        const start = Math.max(0, (matchIndex < 0 ? 0 : matchIndex) - 90);
        const end = Math.min(cleaned.length, start + 220);
        let snippet = escapeHtml(cleaned.slice(start, end).trim());
        if (start > 0) snippet = `…${snippet}`;
        if (end < cleaned.length) snippet = `${snippet}…`;
        terms.sort((a, b) => b.length - a.length).forEach((term) => {
          const pattern = /^[a-z0-9]+$/i.test(term)
            ? `\\b${escapeRegex(term)}\\b`
            : escapeRegex(term);
          snippet = snippet.replace(new RegExp(pattern, 'gi'), '<mark>$&</mark>');
        });
        return snippet;
      }

      function countOccurrences(text, term) {
        return term ? text.split(term).length - 1 : 0;
      }

      function searchCachedPdfIndex(query) {
        const normalizedQuery = normalizeText(query);
        const terms = [...new Set(normalizedQuery.split(/\s+/).filter(Boolean))];
        if (!normalizedQuery || !terms.length) return [];
        const matches = [];
        for (const record of state.pdfIndexRecords.values()) {
          if (!record || record.status !== 'indexed' || !Array.isArray(record.pages)) continue;
          let bestMatch = null;
          for (const page of record.pages) {
            const pageText = normalizeText(page.text);
            const phraseCount = countOccurrences(pageText, normalizedQuery);
            const termCounts = terms.map((term) => countOccurrences(pageText, term));
            const allTermsMatch = termCounts.every((count) => count > 0);
            const anyTermsMatch = termCounts.some((count) => count > 0);
            if (!anyTermsMatch) continue;
            const score = (phraseCount ? 100 : 0) + (allTermsMatch ? 25 : 0)
              + termCounts.reduce((sum, count) => sum + Math.min(count, 10), 0);
            if (!bestMatch || score > bestMatch.score) {
              bestMatch = { score, pageNumber: page.pageNumber, snippet: buildSnippetText(page.text, query) };
            }
          }
          if (bestMatch) matches.push({ filename: record.filename, url: record.url, ...bestMatch });
        }
        return matches.sort((a, b) => b.score - a.score || a.filename.localeCompare(b.filename));
      }

      function renderPdfTextSearchResults(matches) {
        if (!matches.length) {
          elements.pdfSearchResults.innerHTML = '<div class="empty-state">No matching text was found in the indexed PDF pages. Check the indexing status for PDFs that may need OCR or could not be read.</div>';
          return;
        }
        elements.pdfSearchResults.innerHTML = matches.map((match) => `
          <article class="result-card">
            <div>
              <p class="result-summary"><button class="doc-title-button" type="button" data-action="view-doc" data-doc-url="${escapeHtml(match.url)}" data-page-number="${match.pageNumber}">${escapeHtml(match.filename)}</button></p>
              <p class="match-snippet">Page ${match.pageNumber} • ${match.snippet}</p>
            </div>
            <div class="result-actions">
              <button class="primary-btn" type="button" data-action="view-doc" data-doc-url="${escapeHtml(match.url)}" data-page-number="${match.pageNumber}">View page</button>
              <button class="secondary-btn" type="button" data-action="download-doc" data-doc-url="${escapeHtml(match.url)}" data-doc-name="${escapeHtml(match.filename)}">Download</button>
            </div>
          </article>
        `).join('');
      }

      async function performPdfTextSearch(query, indexAlreadyEnsured = false) {
        const searchQuery = query.trim();
        if (!searchQuery) {
          elements.pdfSearchResults.innerHTML = '';
          showStatus('Enter a word, phrase, or sentence to search within PDFs.', '');
          return;
        }
        const currentToken = ++state.pdfSearchToken;
        try {
          if (!indexAlreadyEnsured) {
            const hasCachedIndex = allDocs.every((doc) => state.pdfIndexRecords.has(doc.url));
            if (!hasCachedIndex) showStatus('Building the searchable text index. This is only needed once per PDF version...', '');
            await ensurePdfIndexReady();
          }
          if (currentToken !== state.pdfSearchToken) return;
          if (!state.pdfIndexReady && !state.pdfIndexRecords.size) {
            elements.pdfSearchResults.innerHTML = '<div class="empty-state">The PDF text index is not available yet. Check the indexing status and try again.</div>';
            return;
          }
          const matches = searchCachedPdfIndex(searchQuery);
          if (currentToken !== state.pdfSearchToken) return;
          renderPdfTextSearchResults(matches);
          if (matches.length) {
            const noText = [...state.pdfIndexRecords.values()].filter((record) => record.status === 'empty');
            const failed = [...state.pdfIndexRecords.values()].filter((record) => record.status === 'error');
            const details = [];
            if (noText.length) details.push(`OCR may be required for: ${noText.map((record) => record.filename).join(', ')}.`);
            if (failed.length) details.push(`Could not extract text from: ${failed.map((record) => record.filename).join(', ')}.`);
            showStatus(
              `Found ${matches.length} matching PDF${matches.length === 1 ? '' : 's'}.${details.length ? ` ${details.join(' ')}` : ''}`,
              failed.length ? 'error' : 'success'
            );
          } else {
            const noText = [...state.pdfIndexRecords.values()].filter((record) => record.status === 'empty');
            const failed = [...state.pdfIndexRecords.values()].filter((record) => record.status === 'error');
            const details = [];
            if (noText.length) details.push(`OCR may be required for: ${noText.map((record) => record.filename).join(', ')}.`);
            if (failed.length) details.push(`Could not extract text from: ${failed.map((record) => record.filename).join(', ')}.`);
            showStatus(`No matching text found.${details.length ? ` ${details.join(' ')}` : ''}`, failed.length ? 'error' : '');
          }
        } catch (error) {
          console.error('PDF search failed:', error);
          if (currentToken === state.pdfSearchToken) {
            elements.pdfSearchResults.innerHTML = '<div class="empty-state">Unable to search PDF text. Please check your connection and try again.</div>';
            showStatus('PDF text search failed.', 'error');
          }
        }
      }

      function attachEventHandlers() {
        document.addEventListener('click', (event) => {
          const button = event.target.closest('[data-action]');
          if (!button) return;
          if (button.dataset.action === 'view-doc') {
            navigateToDocument(button.dataset.docUrl, Number(button.dataset.pageNumber) || 1);
          } else if (button.dataset.action === 'download-doc') {
            handleDocDownload(button.dataset.docUrl, button.dataset.docName || 'document.pdf');
          }
        });

        elements.clearPdfTextSearch.addEventListener('click', () => {
          elements.pdfTextSearch.value = '';
          elements.pdfSearchResults.innerHTML = '';
          showStatus('', '');
          state.pdfSearchToken += 1;
          clearTimeout(state.textSearchTimer);
          saveSearchQuery('');
        });

        elements.pdfSearchForm.addEventListener('submit', (event) => {
          event.preventDefault();
          clearTimeout(state.textSearchTimer);
          state.pdfSearchToken += 1;
          const query = elements.pdfTextSearch.value.trim();
          saveSearchQuery(query);
          if (query) {
            performPdfTextSearch(query);
          } else {
            elements.pdfSearchResults.innerHTML = '';
            showStatus('Enter a word, phrase, or sentence to search within PDFs.', '');
          }
        });

        elements.pdfTextSearch.addEventListener('input', (event) => {
          const query = event.target.value;
          clearTimeout(state.textSearchTimer);
          state.pdfSearchToken += 1;
          saveSearchQuery(query);
          if (!query.trim()) {
            elements.pdfSearchResults.innerHTML = '';
            showStatus('', '');
            return;
          }
          state.textSearchTimer = setTimeout(() => performPdfTextSearch(query), 250);
        });

        elements.viewerBack.addEventListener('click', () => {
          const route = window.history.state;
          const fallback = isAppRoute(route && route.parent)
            ? route.parent
            : createRoute('home', { query: elements.pdfTextSearch.value });
          goBackWithinApp(fallback);
        });

        window.addEventListener('popstate', (event) => {
          if (isAppRoute(event.state)) renderRoute(event.state);
          else {
            const homeRoute = createRoute('home');
            window.history.replaceState(homeRoute, '');
            renderRoute(homeRoute);
          }
        });

        elements.openInNewTab.addEventListener('click', () => {
          if (state.currentDoc) window.open(state.currentDoc.url, '_blank', 'noopener,noreferrer');
        });
        elements.downloadCurrentPdf.addEventListener('click', () => {
          if (state.currentDoc) handleDocDownload(state.currentDoc.url, state.currentDoc.filename);
        });
        elements.pdfFrame.addEventListener('error', () => {
          elements.viewerError.textContent = 'This PDF could not be displayed inline. Open it in a new tab or download it instead.';
          elements.viewerError.style.display = 'block';
          elements.pdfFrame.style.display = 'none';
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        if (window.pdfjsLib) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        attachEventHandlers();
        const initialRoute = isAppRoute(window.history.state) ? window.history.state : createRoute('home');
        window.history.replaceState(initialRoute, '');
        renderRoute(initialRoute);
      });    </script>
  </body>
</html>
